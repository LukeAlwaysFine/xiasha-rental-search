  if (!match) return;
  var m = markerMap[String(match[1])];
  if (m && m._hovered && m !== activeBounceMarker) {
    resetMarkerStyle(m);
    m._hovered = false;
  }
}, true);

// 卡片点击委托
document.addEventListener('click', function(e) {
  if (typeof e.target.closest !== 'function') return;
  var card = e.target.closest('.listing-card');
  if (!card) return;
  if (e.target.closest('a, button, .fav-btn')) return;
  var match = card.id.match(/^card-(\d+)$/);
  if (match) handleCardClick(parseInt(match[1]));
});

function timeAgo(iso) {
  if (!iso) return '<span class="time-fresh" style="color:#999">● 未知</span>';
  var ts = new Date(iso).getTime();
  if (isNaN(ts)) return '<span class="time-fresh" style="color:#999">● 未知</span>';
  var diff = Date.now() - ts;
  var mins = Math.floor(diff / 60000);
  var hrs = Math.floor(mins / 60);
  var days = Math.floor(hrs / 24);
  var color = hrs < 72 ? '#2ed573' : (days < 14 ? '#ffa502' : '#ff4757');
  var label = mins < 1 ? '刚刚' : (mins < 60 ? mins + '分钟前' : (hrs < 24 ? hrs + '小时前' : days + '天前'));
  var badge = days >= 14 ? ' <span style="color:#ff4757;font-size:11px">· 可能已租出</span>' : '';
  return '<span class="time-fresh" style="color:' + color + '">● ' + label + '</span>' + badge;
}

// ——— 收藏 ———
var FAV_KEY = 'rental_favs';
function getFavs() { try { return JSON.parse(localStorage.getItem(FAV_KEY) || '[]'); } catch(e) { return []; } }
function isFav(url, id) { return getFavs().includes(url) || (id ? _favIds.indexOf(id) >= 0 : false); }
function isFavById(id) { return _favIds.indexOf(id) >= 0; }

async function toggleFav(url, id) {
  var wasFav = isFav(url) || isFavById(id);
  var btn = document.querySelector('#card-' + id + ' .fav-btn');

  // 乐观更新 UI
  if (wasFav) {
    _favIds = _favIds.filter(function(x) { return x !== id; });
  } else {
    if (_favIds.indexOf(id) < 0) _favIds.push(id);
  }
  if (btn) btn.classList.toggle('active', !wasFav);

  // localStorage 同步
  var favs = getFavs();
  var idx = favs.indexOf(url);
  if (wasFav) {
    if (idx >= 0) favs.splice(idx, 1);
  } else {
    if (idx < 0 && url) favs.push(url);
  }
  localStorage.setItem(FAV_KEY, JSON.stringify(favs));

  // 服务端 API
  try {
    if (wasFav) {
      await fetch('/api/favorites/' + id, { method: 'DELETE' });
    } else {
      await fetch('/api/favorites/' + id, { method: 'POST' });
    }
    showToast(wasFav ? '已取消收藏' : '已加入收藏', 'success');
    updateFavCountBadge();
  } catch(e) {
    // API 失败回滚 UI
    console.warn('收藏 API 失败，回滚:', e);
    if (wasFav) {
      if (_favIds.indexOf(id) < 0) _favIds.push(id);
    } else {
      _favIds = _favIds.filter(function(x) { return x !== id; });
    }
    if (btn) btn.classList.toggle('active', wasFav);
  }
}

async function loadFavoriteIds() {
  try {
    var resp = await fetch('/api/favorites/ids');
    var data = await resp.json();
    _favIds = data.ids || [];
    updateFavCountBadge();
    // 更新当前页面上的收藏按钮状态
    document.querySelectorAll('.fav-btn').forEach(function(btn) {
      var id = parseInt(btn.getAttribute('data-id'));
      var url = btn.getAttribute('data-url');
      btn.classList.toggle('active', isFav(url) || isFavById(id));
    });
  } catch(e) {
    console.warn('加载收藏列表失败:', e);
  }
}

function updateFavCountBadge() {
  var n = _favIds.length;
  var hdr = document.getElementById('headerFavBtn');
  if (hdr) {
    var badge = hdr.querySelector('.fav-count');
    if (badge) badge.textContent = n;
  }
}

function toggleFavFilter() {
  favoritesOnly = !favoritesOnly;
  var hdr = document.getElementById('headerFavBtn');
  if (hdr) hdr.classList.toggle('active', favoritesOnly);
  search(true);
}

// ——— 地址自动补全 ———
var _commuteTimer = null, _commuteIdx = -1, _tipsCache = [];
var _HIST_KEY = 'addr_history';
function _getHistory() { try { return JSON.parse(localStorage.getItem(_HIST_KEY) || '[]'); } catch(e) { return []; } }
function _saveHistory(addr) {
  if (!addr || !addr.trim()) return;
  var h = _getHistory().filter(function(a) { return a !== addr; });
  h.unshift(addr);
  if (h.length > 10) h.length = 10;
  localStorage.setItem(_HIST_KEY, JSON.stringify(h));
}

function setupCommuteAutocomplete() {
  var input = document.getElementById('commute_ref');
  var dropdown = document.getElementById('commuteDropdown');
  if (!input || !dropdown) return;

  function hideDropdown() { dropdown.classList.remove('show'); _commuteIdx = -1; }

  function selectTip(tip) {
    _saveHistory(input.value.trim() || tip.name);
    input.value = tip.name;
    commuteCoords = { lng: tip.lng, lat: tip.lat };
    document.getElementById('commuteStatus').textContent = '✅ ' + (tip.district || tip.name);
    hideDropdown();
    setSort('distance', document.getElementById('sortDistance'));
    updateReferenceMarker(true);
    search(true);
  }

  function _showHistory() {
    var hist = _getHistory();
    if (!hist.length) return;
    _commuteIdx = -1;
    _tipsCache = [];  // 清除旧 API 数据，防止历史模式下误选
    var html = '<div class=\"tip-item\" style=\"color:var(--text-muted);font-size:11px;cursor:default;border-bottom:1px solid #f0f0f0\">最近搜索</div>';
    hist.forEach(function(a, i) {
      html += '<div class=\"tip-item\" data-history=\"' + i + '\">'
        + '<div class=\"tip-name\">🕐 ' + escapeHtml(a) + '</div></div>';
    });
    dropdown.innerHTML = html;
    dropdown.classList.add('show');
  }

  input.addEventListener('focus', function() {
    if (input.value.trim() === '') _showHistory();
  });

  input.addEventListener('input', function() {
    clearTimeout(_commuteTimer);
    var val = input.value.trim();
    if (!val) { _showHistory(); return; }
    _commuteTimer = setTimeout(async function() {
      try {
        var resp = await fetch('/api/inputtips?keywords=' + encodeURIComponent(val));
        var data = await resp.json();
        _tipsCache = data.tips || [];
        if (!_tipsCache.length) { hideDropdown(); return; }
        _commuteIdx = -1;
        var html = '';
        _tipsCache.forEach(function(t, i) {
          html += '<div class="tip-item" data-idx="' + i + '">'
            + '<div class="tip-name">' + escapeHtml(t.name) + '</div>'
            + (t.district ? '<div class="tip-district">' + escapeHtml(t.district) + (t.address ? ' · ' + escapeHtml(t.address) : '') + '</div>' : '')
            + '</div>';
        });
        dropdown.innerHTML = html;
        dropdown.classList.add('show');
      } catch(e) { hideDropdown(); }
    }, 250);
  });

  input.addEventListener('keydown', function(e) {
    var items = dropdown.querySelectorAll('.tip-item');
    if (!items.length) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); _commuteIdx = Math.min(_commuteIdx + 1, items.length - 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); _commuteIdx = Math.max(_commuteIdx - 1, 0); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      if (_commuteIdx >= 0) {
        var item = items[_commuteIdx];
        var histIdx = item.getAttribute('data-history');
        if (histIdx !== null) {
          var addr = _getHistory()[parseInt(histIdx)];
          if (addr) { input.value = addr; hideDropdown(); setCommuteRef(); }
        } else if (_tipsCache[_commuteIdx]) {
          selectTip(_tipsCache[_commuteIdx]);
        }
      }
    }
    else if (e.key === 'Escape') { hideDropdown(); return; }
    else return;
    items.forEach(function(it, i) { it.classList.toggle('active', i === _commuteIdx); });
  });

  dropdown.addEventListener('click', function(e) {
    if (!e.target.closest) return;
    var item = e.target.closest('.tip-item');
    if (!item) return;
    // 历史记录点击
    var histIdx = item.getAttribute('data-history');
    if (histIdx !== null) {
      var addr = _getHistory()[parseInt(histIdx)];
      if (addr) {
        input.value = addr;
        hideDropdown();
        setCommuteRef();  // geocode + search
      }
      return;
    }
    // 自动补全点击
    var idx = parseInt(item.getAttribute('data-idx'));
    if (_tipsCache[idx]) selectTip(_tipsCache[idx]);
  });

  document.addEventListener('click', function(e) {
    if (!dropdown.contains(e.target) && e.target !== input) hideDropdown();
  });
}

// ——— 通勤距离排序 ———
var commuteCoords = null;
async function setCommuteRef() {
  var addr = document.getElementById('commute_ref').value.trim();
  var status = document.getElementById('commuteStatus');
  if (!addr) {
    commuteCoords = null;
    status.textContent = '';
    if (referenceMarker) {
      try { referenceMarker.setMap(null); } catch(e) {}
      referenceMarker = null;
    }
    _clearDistanceRings();
    return;
  }
  status.textContent = '定位中...';
  try {
    var resp = await fetch('/api/geocode?address=' + encodeURIComponent(addr));
    var data = await resp.json();
    if (data.lng && data.lat) {
      commuteCoords = { lng: data.lng, lat: data.lat };
      status.textContent = '✅ ' + data.address;
      _saveHistory(addr);
      setSort('distance', document.getElementById('sortDistance'));
      search(true);
    } else {
      status.textContent = '❌ 地址未找到';
    }
  } catch(e) {
    status.textContent = '定位失败';
  }
}

// ——— 回到顶部 FAB ———
function setupFab() {
  var fab = document.createElement('button');
  fab.className = 'fab';
  fab.innerHTML = '↑';
  fab.title = '回到顶部';
  fab.onclick = function() { window.scrollTo({ top: 0, behavior: 'smooth' }); };
  document.body.appendChild(fab);
  window.addEventListener('scroll', function() {
    fab.style.display = window.scrollY > 500 ? 'block' : 'none';
  });

  // 移动端地图/列表切换按钮
  var mobileBtn = document.createElement('button');
  mobileBtn.className = 'mobile-toggle-btn';
  mobileBtn.innerHTML = '🗺️';
  mobileBtn.title = '切换地图/列表';
  mobileBtn.onclick = toggleMobileView;
  document.body.appendChild(mobileBtn);
}

var _mobileShowingMap = false;
function toggleMobileView() {
  _mobileShowingMap = !_mobileShowingMap;
  var mc = document.querySelector('.main-content');
  var btn = document.querySelector('.mobile-toggle-btn');
  if (_mobileShowingMap) {
    mc.classList.add('show-map');
    if (btn) btn.innerHTML = '📋';
    // 触发地图 resize
    setTimeout(function() { if (map) map.resize(); }, 350);
  } else {
    mc.classList.remove('show-map');
    if (btn) btn.innerHTML = '🗺️';
  }
}

// ——— 暗色模式 ———
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  var btn = document.getElementById('themeToggle');
  if (btn) btn.innerHTML = theme === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('theme', theme);
  // 高德地图暗色（如支持）
  if (map) {
    try { map.setMapStyle(theme === 'dark' ? 'amap://styles/dark' : 'amap://styles/light'); } catch(e) {}
  }
}
function toggleTheme() {
  var cur = document.documentElement.getAttribute('data-theme') || 'light';
  applyTheme(cur === 'dark' ? 'light' : 'dark');
}
function initTheme() {
  var saved = localStorage.getItem('theme');
  if (saved) { applyTheme(saved); return; }
  if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
    applyTheme('dark');
  }
  // 监听系统主题变化
  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
      if (!localStorage.getItem('theme')) applyTheme(e.matches ? 'dark' : 'light');
    });
  }
}

// ——— 启动 ———
window.onload = function() {
  initTheme();
  restoreFilterState();
  setupFab();
  initMap();
  setupCommuteAutocomplete();
  setupInfiniteScroll();
  loadFavoriteIds();
  search(true);
};
